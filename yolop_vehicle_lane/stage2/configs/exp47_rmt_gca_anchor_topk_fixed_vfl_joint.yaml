run:
  name: exp47_rmt_gca_anchor_topk_fixed_vfl_joint
  seed: 0
  work_dir: /content/exp47_rmt_gca_anchor_topk_fixed_vfl_joint
  output_tar: /content/drive/MyDrive/EcoCAR/training_runs/exp47_rmt_gca_anchor_topk_fixed_vfl_joint.tar
dataset:
  bdd_archive: /content/drive/MyDrive/EcoCAR/datasets/bdd100k_clrkd_curve.tar
  local_dir: /content/bdd100k_clrkd_curve
  max_lanes: 10
  num_points: 72
  image_size:
  - 384
  - 640
  org_image_size:
  - 720
  - 1280
  aux_mask_size:
  - 72
  - 128
  vehicle_classes:
  - vehicle
model:
  backbone: exp2b_rmt_gca
  width: 0.5
  use_aifi: true
  yolo26:
    source_root: null
    model_path: null
    feature_indices: null
    strict: true
  detection_head:
    type: detr
    num_queries: 100
    num_classes: 1
    embed_dim: 256
    num_decoder_layers: 3
    num_heads: 8
    dim_feedforward: 1024
  lane_head:
    type: clrkd
    embed_dim: 128
    max_lanes: 10
    num_points: 72
    num_priors: 192
    sample_points: 36
    roi_refine_layers: 3
    roi_mid_channels: 48
    cross_attn_resize:
    - 10
    - 25
    cls_uses_prior_embedding: true
    prior_embed_encoder_dim: 64
    cls_separate_path: false
    mask_size:
    - 72
    - 128
    mask_aux: true
    num_lane_classes: 7
loss:
  det:
    bbox_loss_weight: 5.0
    cls_loss_weight: 1.0
    dn_loss_weight: 0.0
    giou_loss_weight: 2.0
    obj_loss_weight: 1.0
  lambda_gate_reg: 0.001
  lambda_det: 1.0
  lambda_lane: 1.0
  lambda_max: 2.0
  lambda_min: 0.5
  lambda_mode: fixed
  lane:
    # Exp2WW: NB47 (K=64 query head + Hungarian) was the only experiment
    # to break the cls collapse (gap=0.099) but its geometry was weak
    # (matched_iou=0.27) because Hungarian 1-to-1 only gives ~5 positives
    # per image. NB48 (anchor + dynamic-k + full data) hit project record
    # geometry (matched_iou=0.544) but cls stayed flat (gap=0.015).
    #
    # Diagnosis: the cls collapse is caused by dynamic-k's batch-to-batch
    # label flickering, NOT by the alpha constant (NB46 VFL ruled that
    # out). The same prior is labeled positive in some batches and
    # negative in others depending on which competing priors win the IoU
    # contest. Cls converges to uniform sigmoid as the only stable
    # equilibrium under noisy labels.
    #
    # Exp2WW fixes the matching: each GT takes top K=8 priors by cost,
    # deterministically. Same prior gets the same label across batches
    # (modulo training-time cost changes). This gives:
    # - K=8 priors per GT * 5 GT = ~40 positives per image (anchor-style
    #   dense geometry supervision, vs Hungarian's 5)
    # - Stable per-prior labels (vs dynamic-k's flickering)
    # Combined with VFL on continuous LineIoU regression target, cls
    # should finally separate matched from unmatched priors on the
    # 192-anchor head.
    cls_target_type: lineiou_regression
    cls_loss_type: vfl
    vfl_alpha: 0.75
    vfl_gamma: 2.0
    lineiou_target_pow: 1.0
    cls_ohem_topk_per_pos: 0
    cls_balance_mode: balanced
    line_iou_radius: 0.015
    w_cls: 5.0
    w_distill: 0.0
    w_iou: 2.0
    w_mask: 1.0
    w_reg: 1.2
    w_smooth: 0.05
    w_xytl: 0.2
    use_lane_matching: true
    match_cost_cls: 1.0
    match_cost_point: 5.0
    match_cost_iou: 2.0
    match_cost_xytl: 0.2
    # NEW: Exp2WW's stable top-K matching.
    lane_assigner: topk_fixed
    topk_fixed_per_gt: 8
    dynamic_k_topk: 4
    aux_stage_loss_weight: 1.0
    stage1_aux_loss_weight: 0.0
    asl_gamma_pos: 0.0
    asl_gamma_neg: 4.0
    asl_clip: 0.05
    focal_alpha: 0.25
    focal_gamma: 2.0
    qfl_gamma: 2.0
  no_object_weight: 0.25
  use_uncertainty: true
  geometry_warmup_epochs: 1
train:
  lr0: 0.0002
  backbone_lr_mult: 0.1
  head_lr_mult: 2.0
  weight_decay: 0.0005
  end_epoch: 20
  batch_size: 8
  workers: 2
  grad_clip_norm: 5.0
  val_every: 1
  save_every: 5
  print_every: 50
  amp:
    kind: bfloat16
  lr_scheduler:
    kind: cosine
    warmup_epochs: 2
    warmup_start_lr_factor: 0.1
    min_lr_factor: 0.05
  phases:
  - name: head_warmup
    until_epoch: 2
  - name: full_finetune
    until_epoch: 999
eval:
  val_batches: 40
  log_grad_cosine: true
  grad_cos_probe_interval: 50
  lane_exist_threshold: 0.3
  decoded_top_k: 6
  decoded_lane_iou_threshold: 0.5
  decoded_lane_nms_iou: 0.5
  decoded_score_threshold: 0.0
  decoded_score_source: cls
  decoded_oracle_enabled: true
teacher:
  lane_head_checkpoint: null
