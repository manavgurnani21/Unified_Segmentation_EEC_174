run:
  name: exp70_rmt_gca_anchor_cls_sep_vfl_culane_kd_full_data_joint
  seed: 0
  work_dir: /content/exp70_rmt_gca_anchor_cls_sep_vfl_culane_kd_full_data_joint
  output_tar: /content/drive/MyDrive/EcoCAR/training_runs/exp70_rmt_gca_anchor_cls_sep_vfl_culane_kd_full_data_joint.tar
dataset:
  bdd_archive: /content/drive/MyDrive/EcoCAR/datasets/bdd100k_clrkd_curve.tar
  local_dir: /content/bdd100k_clrkd_curve
  max_lanes: 10
  num_points: 72
  image_size:
  - 384
  - 640
  org_image_size:
  - 720
  - 1280
  aux_mask_size:
  - 72
  - 128
  vehicle_classes:
  - vehicle
model:
  backbone: exp2b_rmt_gca
  width: 0.5
  use_aifi: true
  yolo26:
    source_root: null
    model_path: null
    feature_indices: null
    strict: true
  detection_head:
    type: detr
    num_queries: 100
    num_classes: 1
    embed_dim: 256
    num_decoder_layers: 3
    num_heads: 8
    dim_feedforward: 1024
  lane_head:
    type: clrkd
    embed_dim: 128
    max_lanes: 10
    num_points: 72
    num_priors: 192
    sample_points: 36
    roi_refine_layers: 3
    roi_mid_channels: 48
    cross_attn_resize:
    - 10
    - 25
    cls_uses_prior_embedding: true
    prior_embed_encoder_dim: 64
    cls_separate_path: true
    mask_size:
    - 72
    - 128
    mask_aux: true
    num_lane_classes: 7
loss:
  det:
    bbox_loss_weight: 5.0
    cls_loss_weight: 1.0
    dn_loss_weight: 0.0
    giou_loss_weight: 2.0
    obj_loss_weight: 1.0
  lambda_gate_reg: 0.001
  lambda_det: 1.0
  lambda_lane: 1.0
  lambda_max: 2.0
  lambda_min: 0.5
  lambda_mode: fixed
  lane:
    cls_target_type: lineiou_regression
    cls_loss_type: vfl
    vfl_alpha: 0.75
    vfl_gamma: 2.0
    lineiou_target_pow: 1.0
    cls_ohem_topk_per_pos: 0
    cls_balance_mode: balanced
    line_iou_radius: 0.015
    w_cls: 5.0
    # Exp2SSS (NB77): real KD with CULane-pretrained teacher. NB72 self-
    # distilled from NB62 (a student-quality model) and got nothing.
    # Here the teacher is the lane head from NB74 -- trained on CULane,
    # not BDD -- so it actually has different supervision signal to
    # transfer. w_distill=1.0 is the standard CLRKDNet weight.
    w_distill: 1.0
    w_iou: 2.0
    w_mask: 1.0
    w_reg: 1.2
    w_smooth: 0.05
    w_xytl: 0.2
    use_lane_matching: true
    match_cost_cls: 1.0
    match_cost_point: 5.0
    match_cost_iou: 2.0
    match_cost_xytl: 0.2
    lane_assigner: dynamic_k
    dynamic_k_topk: 4
    topk_fixed_per_gt: 8
    aux_stage_loss_weight: 1.0
    stage1_aux_loss_weight: 0.0
    asl_gamma_pos: 0.0
    asl_gamma_neg: 4.0
    asl_clip: 0.05
    focal_alpha: 0.25
    focal_gamma: 2.0
    qfl_gamma: 2.0
  no_object_weight: 0.25
  use_uncertainty: false
  geometry_warmup_epochs: 1
train:
  # Same speed flags as NB73 -- batch=32, lr0=4e-4 (sqrt-scaled), bb_throttle.
  lr0: 0.0004
  backbone_lr_mult: 0.01
  head_lr_mult: 2.0
  weight_decay: 0.0005
  end_epoch: 12
  batch_size: 32
  workers: 6
  grad_clip_norm: 5.0
  val_every: 1
  save_every: 2
  print_every: 50
  amp:
    kind: bfloat16
  lr_scheduler:
    kind: cosine
    warmup_epochs: 1
    warmup_start_lr_factor: 0.1
    min_lr_factor: 0.05
  phases:
  - name: head_warmup
    until_epoch: 1
  - name: full_finetune
    until_epoch: 999
eval:
  val_batches: 40
  log_grad_cosine: true
  grad_cos_probe_interval: 100
  lane_exist_threshold: 0.3
  decoded_top_k: 6
  decoded_lane_iou_threshold: 0.5
  decoded_lane_nms_iou: 0.5
  decoded_score_threshold: 0.0
  decoded_score_source: cls
  decoded_oracle_enabled: true
teacher:
  # Set by NB77's cell 3 after extracting NB74's tar. The notebook overrides
  # this path via command-line / cfg patching at runtime.
  lane_head_checkpoint: /content/exp69_rmt_gca_culane_lane_only_pretrain_culane8/best.pt
